# Azure Web Apps deployment documentation:
# https://github.com/Azure/webapps-deploy

name: Build and deploy FastAPI to Azure - room-rental-api

on:
  push:
    branches:
      - 'feature/authentication'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify backend directory
        run: |
          echo "Checking backend directory..."
          ls -la backend/
          test -f backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/.venv/
            !backend/venv/
            !backend/antenv/
            !backend/**/__pycache__/
            !backend/tests/
            !backend/.env*
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./deployment

      - name: Verify deployment package
        run: |
          ls -la ./deployment
          test -f ./deployment/requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5FDA6010C5DB473E87ACE027BDB0DBC0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_58962BC0FBDF41238767C16672BE43DC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0E58039879BD43309F2DDCB7646562A0 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'room-rental-api'
          slot-name: 'Production'
          package: ./deployment
